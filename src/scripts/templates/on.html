<body class="bg-dark">
            <div class="hero text-white">
                <div class="container">
                    <div class="row">
                        <div class="col-sm-4">
                            <div class="control-panel card bg-secondary">
                                <div class="card-body">
                                    <p class="card-title" style="font-size: 17px; font-weight: 400; letter-spacing: 1px;">Control Panel</p>
        
                                    <button class="btn btn-start">Power On</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-8">
                            <div class="card bg-secondary">
                                <div class="card-body">
                                    <h5 class="card-title" style="font-size: 17px; font-weight: 400; letter-spacing: 1px;">Statistics</h5>
                                    <div class="statistics">
                                        <div class="cpu-temp statistic">
                                            <h5>36°</h5>
                                            <p>CPU</p>
                                        </div>
                                        <div class="cpu-usage statistic">
                                            <h5>8%</h5>
                                            <p>CPU</p>
                                        </div>
                                        <div class="gpu-temp statistic">
                                            <h5>36°</h5>
                                            <p>CPU</p>
                                        </div>
                                        <div class="gpu-usage statistic">
                                            <h5>2%</h5>
                                            <p>GPU</p>
                                        </div>
                                        <div class="ram statistic">
                                            <h5>40%</h5>
                                            <p>RAM</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
