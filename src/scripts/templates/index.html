<!DOCTYPE html>
<html>

<head>
    <title>Home Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.3/umd/popper.min.js"
        integrity="sha384-vFJXuSJphROIrBnz7yo7oB41mKfc8JzQZiCq4NCceLEaO4IHwicKwpJf9c9IpFgh"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/js/bootstrap.min.js"
        integrity="sha384-alpBpkh1PFOepccYVYDB4do5UnbKysX5WZXm3XxPqe5iKTfUKjNkCk9SaVuEZflJ"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static',filename='js/app.js') }}"></script>


    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/styles.css') }}">
</head>

<body class="bg-dark">
    <div class="hero text-white">
        <div class="container-lg">
            <div class="row">
                <div class="col-sm-4">
                    <div class="control-panel card bg-secondary">
                        <div class="card-body">
                            <p class="card-title" style="font-size: 17px; font-weight: 400; letter-spacing: 1px;">
                                Control Panel</p>

                            <form name="dropdown-form" class="form-inline" method="post" action="/on">
                                <div class="form-group">
                                    <div class="input-group">
                                            <select name="comp_select" class="selectpicker form-control">
                                            {% for o in data %}
                                            <option value="{{ o.name }}">{{ o.name }}</option>
                                            {% endfor %}
                                            </select>
                                    </div>
                                </div>
                            </form>

                            <button class="btn btn-start" name="start-action" onclick="submit()">Start</button>
                            <button class="btn btn-start" name="stop-action" onclick="fetchStop()">Stop</button>
                        </div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="card bg-secondary">
                        <div class="card-body">
                            <h5 class="card-title" style="font-size: 17px; font-weight: 400; letter-spacing: 1px;">System Information</h5>

                            <p>Model: {{ model }}</p>
                            <p>Storage: {{ storage }}</p>
                            <p>Uptime: {{ uptime }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
